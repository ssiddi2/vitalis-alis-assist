name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Multi-tenant RLS tenancy gate
        run: npm run test:tenancy
        env:
          RLS_TEST_SUPABASE_URL: ${{ secrets.RLS_TEST_SUPABASE_URL }}
          RLS_TEST_ANON_KEY: ${{ secrets.RLS_TEST_ANON_KEY }}
          RLS_TEST_A_EMAIL: ${{ secrets.RLS_TEST_A_EMAIL }}
          RLS_TEST_A_PASSWORD: ${{ secrets.RLS_TEST_A_PASSWORD }}
          RLS_TEST_HOSPITAL_B_ID: ${{ secrets.RLS_TEST_HOSPITAL_B_ID }}
          RLS_TEST_PATIENT_B_ID: ${{ secrets.RLS_TEST_PATIENT_B_ID }}

      - name: Production build
        run: npm run build

      - name: Dependency audit (blocking on high/critical)
        run: npm audit --omit=dev --audit-level=high
